general:
  kafka-topic: trader-updates

server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: jdbc:h2:mem:midas;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: midas-core
      auto-offset-reset: earliest #Fixes the task2  not always displaying cus of race condition
      properties:
        spring.json.trusted.packages: com.jpmc.midascore.foundation

logging:
  level:
    com.jpmc.midascore: DEBUG
